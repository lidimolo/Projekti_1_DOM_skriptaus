<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="img/favicon.png">

    <script src="summary.js" defer></script>
    <title>Yhteenveto - TimeChecker</title>
  </head>
  <body>
    <h1>TimeChecker</h1>

    <nav>
      <a href="index.html">Lisää</a>
      <a href="yhteenveto.html" class="active_y">Yhteenveto</a>
    </nav>

    <h3>Ajankäytön yhteenveto</h3>

    <div>
      <p>Kokonaisaika</p>
      <p id="totalTime" class="totalTime">0 h 0 min</p>
    </div>
    <div>
      Aika kategorioittain
      <ul class="summaryList">
        <li>Työ <span id="workTime">0 h 0 min</span></li>
        <li>Opiskelu <span id="studyTime">0 h 0 min</span></li>
        <li>Urheilu <span id="sportTime">0 h 0 min</span></li>
        <li>Hobby <span id="hobbyTime">0 h 0 min</span></li>
        <li>Muu <span id="otherTime">0 h 0 min</span></li>
      </ul>
    </div>
    <h3>Ajankäytön prosentteina</h3>
    <div id="bar">
      <p>Työ<span id="workPercent">0%</span></p>
      <div class="bar"><div id="workBar"></div></div>

      <p>Opiskelu<span id="studyPercent">0%</span></p>
      <div class="bar"><div id="studyBar"></div></div>

      <p>Urheilu<span id="sportPercent">0%</span></p>
      <div class="bar"><div id="sportBar"></div></div>

      <p>Hobby<span id="hobbyPercent">0%</span></p>
      <div class="bar"><div id="hobbyBar"></div></div>

      <p>Muu<span id="otherPercent">0%</span></p>
      <div class="bar"><div id="otherBar"></div></div>
    </div>
  </body>
</html>
